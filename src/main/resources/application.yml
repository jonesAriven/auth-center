server:
  port: 8085

spring:
  application:
    name: auth-center
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:platform-nacos}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos123}

  # M7: 邮件发送（邮箱验证码 / 忘记密码）。凭证一律走环境变量，禁止硬编码
  mail:
    host: ${MAIL_HOST:}
    # 163 邮箱走 25 端口（明文/STARTTLS）；465 才需要 SSL，故全部改为 env 可配
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
            required: false
    default-encoding: UTF-8
    # 163 要求发件人与认证账号一致，否则 553
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@marschat.online}}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（legacy 直登接口用，RS256 过渡期保留）
jwt:
  secret: YourSuperSecretKeyForJwtTokenGenerationMustBe256BitsLong!!
  access-token-expiration: 900000      # 15 分钟
  refresh-token-expiration: 604800000  # 7 天

# 统一认证中心（auth-center Phase 1）：OIDC issuer 必须与客户端实际访问地址一致
marschat:
  auth:
    issuer: ${AUTH_ISSUER:http://auth-center:8085}

# AES-256-GCM 加密密钥（32字节 Base64），用于 API Token 加密存储
crypto:
  aes-key: "YWVzLTI1Ni1nY20ta2V5LTMyLWJ5dGVzISE="

# API Token 配置
api-token:
  prefix: "kb_"
  expire-days: 365

# SSO Cookie 配置（跨域单点登录）
# 登录成功后，通过 Set-Cookie 响应头设置 Domain 级别 Cookie
# 使 marschat.online 下所有子域共享登录状态
sso:
  cookie:
    # Access Token Cookie 名称（必须与前端 auth-components 一致）
    access-token-name: sso_access_token
    # Refresh Token Cookie 名称
    refresh-token-name: sso_refresh_token
    # Cookie 域名 - 覆盖所有子域
    # 注意：不要写前导点（.marschat.online）。RFC 6265 下 Domain 不含前导点，
    # Tomcat 10 的 Rfc6265CookieProcessor 会直接抛 IllegalArgumentException
    # （An invalid domain [.marschat.online]），导致 /auth/login 整个 500。
    # 写作 marschat.online 同样覆盖全部子域。
    domain: marschat.online
    # Cookie 路径
    path: /
    # 是否仅 HTTPS（生产环境必须为 true，开发环境可设为 false）
    secure: true
    # SameSite 策略（Lax 允许顶级导航携带 Cookie）
    same-site: Lax
    # Access Token 过期时间（秒），默认 2 小时
    max-age: 7200
    # Refresh Token 过期时间（秒），默认 7 天
    refresh-token-max-age: 604800

logging:
  level:
    com.marschat.authcenter: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# M6: springdoc-openapi 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

# 请求日志配置
kb:
  web-log:
    event-enabled: true
