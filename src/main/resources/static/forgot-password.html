<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找回密码 · MarsChat 统一认证</title>
  <style>
    :root { --brand: #2563eb; --brand-dark: #1d4ed8; --text: #1f2937; --muted: #6b7280; --border: #d1d5db; --bg: #f3f4f6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: linear-gradient(135deg, #eef2ff 0%, var(--bg) 100%);
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); }
    .card { width: 100%; max-width: 400px; background: #fff; border-radius: 14px; padding: 40px 36px 32px;
            box-shadow: 0 10px 40px rgba(15, 23, 42, .10); }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--brand); color: #fff;
            display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; }
    h1 { font-size: 19px; margin: 0; font-weight: 600; }
    .subtitle { color: var(--muted); font-size: 13px; margin: 0 0 26px 44px; }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #374151; }
    input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid var(--border);
            border-radius: 8px; outline: none; transition: border-color .15s, box-shadow .15s; }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
    .field { margin-bottom: 16px; }
    button { width: 100%; padding: 11px; font-size: 15px; font-weight: 600; color: #fff; background: var(--brand);
             border: none; border-radius: 8px; cursor: pointer; transition: background .15s; }
    button:hover { background: var(--brand-dark); }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .msg { display: none; font-size: 13px; padding: 9px 12px; border-radius: 8px; margin-bottom: 16px; }
    .msg.show { display: block; }
    .msg.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
    .msg.err { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
    .hint { font-size: 13px; color: var(--muted); background: #f8fafc; border: 1px solid #e5e7eb;
            border-radius: 8px; padding: 10px 12px; margin: 0 0 18px; line-height: 1.5; }
    .resend { text-align: center; font-size: 13px; color: var(--muted); margin-top: 14px; }
    .resend a { color: var(--brand); text-decoration: none; }
    .resend a:hover { text-decoration: underline; }
    .resend a.disabled { color: #9ca3af; cursor: not-allowed; pointer-events: none; }
    .resend .cd { color: #9ca3af; }
    .done { text-align: center; padding: 8px 0 4px; }
    .done .okbox { display: inline-block; font-size: 14px; padding: 12px 16px; border-radius: 10px;
            background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; margin-bottom: 20px; }
    .back { display: block; text-align: center; font-size: 13px; color: var(--brand); text-decoration: none; margin-top: 18px; }
    .back:hover { text-decoration: underline; }
    .footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 22px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="logo">M</div>
      <h1>找回密码</h1>
    </div>
    <p class="subtitle" id="subtitle">输入注册邮箱，我们将发送重置验证码</p>

    <div class="msg" id="msg"></div>

    <!-- 第 1 步：输入邮箱发送验证码 -->
    <form id="step1" novalidate>
      <div class="field">
        <label for="email">注册邮箱</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" autofocus required>
      </div>
      <button type="submit" id="sendBtn">发送重置验证码</button>
    </form>

    <!-- 第 2 步：输入验证码 + 新密码 -->
    <form id="step2" novalidate style="display:none;">
      <p class="hint" id="sentHint"></p>
      <div class="field">
        <label for="code">邮箱验证码</label>
        <input type="text" id="code" name="code" placeholder="请输入 6 位验证码" autocomplete="one-time-code" inputmode="numeric" maxlength="8">
      </div>
      <div class="field">
        <label for="pwd">新密码</label>
        <input type="password" id="pwd" name="pwd" placeholder="6–64 位" autocomplete="new-password">
      </div>
      <div class="field">
        <label for="pwd2">确认新密码</label>
        <input type="password" id="pwd2" name="pwd2" placeholder="再次输入新密码" autocomplete="new-password">
      </div>
      <button type="submit" id="resetBtn">重置密码</button>
      <div class="resend">
        <a href="#" id="resendLink">重新发送验证码</a>
        <span class="cd" id="countdown"></span>
      </div>
    </form>

    <!-- 成功态：不再允许重复提交 -->
    <div id="done" class="done" style="display:none;">
      <div class="okbox">密码已重置，请用新密码登录</div>
      <button type="button" id="toLoginBtn">去登录</button>
    </div>

    <a class="back" href="/login.html">← 返回登录</a>
    <div class="footer">MarsChat 平台认证中心</div>
  </div>

  <script>
    var step1 = document.getElementById('step1');
    var step2 = document.getElementById('step2');
    var done = document.getElementById('done');
    var msg = document.getElementById('msg');
    var emailInput = document.getElementById('email');
    var sendBtn = document.getElementById('sendBtn');
    var resetBtn = document.getElementById('resetBtn');
    var resendLink = document.getElementById('resendLink');
    var countdownEl = document.getElementById('countdown');
    var sentHint = document.getElementById('sentHint');
    var toLoginBtn = document.getElementById('toLoginBtn');

    var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    var countdownTimer = null;
    var currentEmail = '';

    function show(cls, text) {
      msg.className = 'msg show ' + cls;
      msg.textContent = text;
    }
    function hideMsg() { msg.className = 'msg'; msg.textContent = ''; }

    // 统一调用 auth-center 接口并解析 Result 信封：{code, message, data, traceId}
    // ⚠️ 业务异常同样返回 HTTP 200，真实错误码在 body.code，必须同时校验两者
    function callAuthApi(url, body) {
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(function (r) {
        if (!r.ok) { throw new Error('请求失败（HTTP ' + r.status + '）'); }
        return r.json().catch(function () { return {}; });
      }).then(function (res) {
        if (res && typeof res.code === 'number' && res.code !== 200) {
          throw new Error(res.message || '操作失败，请稍后重试');
        }
        return res;
      });
    }

    function startCountdown(seconds) {
      var left = seconds;
      resendLink.classList.add('disabled');
      countdownEl.textContent = left + ' 秒后可重新发送';
      if (countdownTimer) { clearInterval(countdownTimer); }
      countdownTimer = setInterval(function () {
        left -= 1;
        if (left <= 0) {
          clearInterval(countdownTimer);
          countdownTimer = null;
          resendLink.classList.remove('disabled');
          countdownEl.textContent = '';
        } else {
          countdownEl.textContent = left + ' 秒后可重新发送';
        }
      }, 1000);
    }

    function goStep2(email) {
      currentEmail = email;
      step1.style.display = 'none';
      step2.style.display = 'block';
      done.style.display = 'none';
      hideMsg();
      sentHint.textContent = '验证码已发送到 ' + email + '（10 分钟内有效）';
      document.getElementById('code').value = '';
      document.getElementById('pwd').value = '';
      document.getElementById('pwd2').value = '';
      document.getElementById('code').focus();
      startCountdown(60);
    }

    function showDone() {
      step1.style.display = 'none';
      step2.style.display = 'none';
      done.style.display = 'block';
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
      hideMsg();
    }

    // 发送验证码（第 1 步与「重新发送」共用）
    function sendCode(email) {
      sendBtn.disabled = true;
      sendBtn.textContent = '发送中…';
      resendLink.classList.add('disabled');
      callAuthApi('/auth/forgot-password', { email: email })
        .then(function () {
          // 无论邮箱是否存在都返回同一提示，避免账号枚举（安全惯例）
          show('ok', '若该邮箱已注册，重置验证码已发送，请查收邮件（10 分钟内有效）');
          goStep2(email);
        })
        .catch(function (err) {
          show('err', err.message || '发送失败，请稍后重试');
          sendBtn.disabled = false;
          sendBtn.textContent = '发送重置验证码';
        });
    }

    step1.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = emailInput.value.trim();
      if (!email) { show('err', '请输入邮箱'); return; }
      if (!EMAIL_RE.test(email)) { show('err', '邮箱格式不正确'); return; }
      sendCode(email);
    });

    resendLink.addEventListener('click', function (e) {
      e.preventDefault();
      if (resendLink.classList.contains('disabled')) { return; }
      if (!currentEmail) { return; }
      resendLink.classList.add('disabled');
      callAuthApi('/auth/forgot-password', { email: currentEmail })
        .then(function () {
          show('ok', '验证码已重新发送，请查收邮件（10 分钟内有效）');
          startCountdown(60);
        })
        .catch(function (err) {
          show('err', err.message || '发送失败，请稍后重试');
          resendLink.classList.remove('disabled');
        });
    });

    step2.addEventListener('submit', function (e) {
      e.preventDefault();
      var code = document.getElementById('code').value.trim();
      var pwd = document.getElementById('pwd').value;
      var pwd2 = document.getElementById('pwd2').value;
      if (!code) { show('err', '请输入验证码'); return; }
      if (pwd.length < 6 || pwd.length > 64) { show('err', '新密码长度需为 6–64 位'); return; }
      if (pwd !== pwd2) { show('err', '两次输入的密码不一致'); return; }

      resetBtn.disabled = true;
      resetBtn.textContent = '重置中…';
      callAuthApi('/auth/reset-password', { email: currentEmail, code: code, newPassword: pwd })
        .then(function () {
          showDone();
        })
        .catch(function (err) {
          show('err', err.message || '重置失败，请稍后重试');
          resetBtn.disabled = false;
          resetBtn.textContent = '重置密码';
        });
    });

    toLoginBtn.addEventListener('click', function () { window.location.href = '/login.html'; });
  </script>
</body>
</html>
